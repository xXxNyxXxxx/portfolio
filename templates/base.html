<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ profile.name }} | {{ profile.title }}{% endblock %}</title>
  <meta name="description" content="{{ profile.tagline }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md site-nav">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">{{ profile.name }}</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto gap-md-3">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#experience">Experience</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#skills">Skills</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#projects">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
      <span>&copy; {{ year }} {{ profile.name }}</span>
      <span>
        <a href="{{ profile.github }}" target="_blank" rel="noopener">GitHub</a>
        <a href="{{ profile.linkedin }}" target="_blank" rel="noopener" class="ms-3">LinkedIn</a>
        <a href="mailto:{{ profile.email }}" class="ms-3">Email</a>
      </span>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
